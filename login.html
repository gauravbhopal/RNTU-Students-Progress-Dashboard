<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduEval Pro — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4361ee">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: #4361ee; top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #f72585; bottom: -80px; right: -80px; animation-delay: 3s; }
        .orb-3 { width: 250px; height: 250px; background: #4cc9f0; top: 50%; left: 60%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(67, 97, 238, 0.4);
            font-size: 28px;
        }

        .logo-area h1 {
            font-size: 26px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .logo-area p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 6px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.25); }

        .form-control:focus {
            border-color: #4361ee;
            background: rgba(67, 97, 238, 0.1);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }

        .input-wrapper .form-control { padding-right: 48px; }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4361ee, #4895ef);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(67, 97, 238, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .login-btn:hover::before { opacity: 1; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(67, 97, 238, 0.5); }
        .login-btn:active { transform: translateY(0); }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(247, 37, 133, 0.15);
            border: 1px solid rgba(247, 37, 133, 0.3);
            color: #ff6db0;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 28px 0 24px;
        }

        .info-footer {
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: rgba(76, 201, 240, 0.15);
            border: 1px solid rgba(76, 201, 240, 0.3);
            color: #4cc9f0;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">🎓</div>
                <h1>EduEval Pro</h1>
                <p>Multi-Institute Student Evaluation Platform</p>
            </div>

            <div class="error-msg" id="errorMsg">❌ <span id="errorText"></span></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="input-icon" id="togglePwd" title="Show/Hide password">👁</span>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Sign In to Portal
                </button>
            </form>


        </div>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, signInWithEmailAndPassword, doc, getDoc } from './firebase-config.js';

        // If already logged in, redirect
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await redirectUser(user);
            }
        });

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const togglePwd = document.getElementById('togglePwd');
        const passwordInput = document.getElementById('password');

        // Toggle password visibility
        togglePwd.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePwd.textContent = type === 'password' ? '👁' : '🙈';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            setLoading(true);
            hideError();

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await redirectUser(userCredential.user);
            } catch (err) {
                let msg = 'Login failed. Please check your credentials.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    msg = 'Invalid email or password. Please try again.';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = 'Too many failed attempts. Please wait a moment and try again.';
                }
                showError(msg);
                setLoading(false);
            }
        });

        async function redirectUser(user) {
            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'superadmin') {
                        window.location.href = 'superadmin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    // Default redirect
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error('Error fetching user role:', err);
                window.location.href = 'index.html';
            }
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            loginBtn.innerHTML = loading
                ? '<span class="spinner"></span>Signing In...'
                : 'Sign In to Portal';
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }
        // ── PWA Service Worker Registration ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.error('SW Register Fail', err));
            });
        }

        // PWA Install Button Handler
        let deferredPrompt;
        const installBtn = document.createElement('button');
        installBtn.style.cssText = 'display:none; width:100%; padding:10px; margin-top:15px; border-radius:12px; border:1px dashed var(--accent); background:rgba(76,201,240,0.1); color:var(--accent); font-weight:600; cursor:pointer; font-family:"Inter",sans-serif; text-align:center; transition:0.3s;';
        installBtn.innerHTML = '📲 Install EduEval Pro App';
        installBtn.addEventListener('mouseover', () => installBtn.style.background = 'rgba(76,201,240,0.2)');
        installBtn.addEventListener('mouseout', () => installBtn.style.background = 'rgba(76,201,240,0.1)');
        
        // Add to card
        document.querySelector('.login-card').appendChild(installBtn);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
